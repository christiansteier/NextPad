[package]
name = "nextpad"
version = "0.3.1"
authors = ["Christian-Maximilian Steier"]
edition = "2021"
description = "Etherpad-kompatibler Pad-Server auf Yjs/yrs für mod_etherpadlite"
license = "EUPL-1.2"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
futures-util = "0.3"
yrs = { version = "0.28", features = ["sync"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
html-escape = "0.2"
scraper = "0.29"
ego-tree = "0.11"
bytes = "1"
base64 = "0.22"
ipnet = "2"
serde_urlencoded = "0.7"
tower-http = { version = "0.7", features = ["trace"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
include_dir = "0.7"
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
