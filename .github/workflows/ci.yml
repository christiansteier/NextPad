name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # Editor- und Zeichenbrett-Bündel, der Server bettet sie beim Übersetzen ein
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.28.5 --no-fund --no-audit
      - run: bash web/build.sh
        working-directory: .
        env:
          NEXTPAD_WEB_BUILD: ${{ runner.temp }}/web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked
      # bekannte Schwachstellen in Abhängigkeiten (RustSec), Ausnahmen mit Begründung in .cargo/audit.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
