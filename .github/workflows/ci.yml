name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # Editor- und Zeichenbrett-Bündel, der Server bettet sie beim Übersetzen ein
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.28.5 --no-fund --no-audit
      - run: bash web/build.sh
        working-directory: .
        env:
          NEXTPAD_WEB_BUILD: ${{ runner.temp }}/web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      # Browser- und API-Tests gegen frisch gestartete Server, dasselbe Skript wie lokal
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ runner.temp }}/web
      - run: bash web/test/browsertests.sh server/target/debug/nextpad
        working-directory: .
        env:
          NEXTPAD_WEB_BUILD: ${{ runner.temp }}/web
          NEXTPAD_TEST_LOGS: ${{ runner.temp }}/browsertests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browsertests
          path: ${{ runner.temp }}/browsertests
          if-no-files-found: ignore
      # bekannte Schwachstellen in Abhängigkeiten (RustSec), Ausnahmen mit Begründung in .cargo/audit.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
